<style>

:root{
  --ink:#16181D; --ground:#EDEBE5; --card:#FFFDFA; --line:#DAD6CC;
  --green:#0C6B47; --green-mid:#128A5C; --green-soft:#E0EFE7;
  --brick:#9B4A32; --mute:#65685F;
  --tone:#0C6B47; --tint:#E0EFE7;           /* per-topic, set inline */
  --display:'Playfair Display',Georgia,serif; --read:'Lora',Georgia,serif;
  --ui:'DM Sans',system-ui,-apple-system,sans-serif;
}

/* ── THEMES ──────────────────────────────────────────────────── */
@media(prefers-color-scheme:dark){
  :root:not([data-theme]):not([data-theme="light"]){
    --ink:#F0EDE8; --ground:#111110; --card:#1C1C1A; --line:#2C2C2A;
    --green:#34C77B; --green-mid:#30B870; --green-soft:#0D2B1E;
    --brick:#E07055; --mute:#8E8E93;
  }
}
[data-theme="dark"],#device[data-theme="dark"]{
  --ink:#F0EDE8; --ground:#111110; --card:#1C1C1A; --line:#2C2C2A;
  --green:#34C77B; --green-mid:#30B870; --green-soft:#0D2B1E;
  --brick:#E07055; --mute:#8E8E93;
}
[data-theme="light"],#device[data-theme="light"]{
  --ink:#16181D; --ground:#EDEBE5; --card:#FFFDFA; --line:#DAD6CC;
  --green:#0C6B47; --green-mid:#128A5C; --green-soft:#E0EFE7;
  --brick:#9B4A32; --mute:#65685F;
}
[data-theme="dyslexic"],#device[data-theme="dyslexic"]{
  --ink:#16181D; --ground:#FDF6E3; --card:#FFFDF7; --line:#E8DFC8;
  --green:#0C6B47; --green-mid:#128A5C; --green-soft:#E0EFE7;
  --brick:#9B4A32; --mute:#65685F;
  --read:'OpenDyslexic','Lora',Georgia,serif;
}
[data-theme="adhd"],#device[data-theme="adhd"]{
  --ink:#16181D; --ground:#F5F0FF; --card:#FEFCFF; --line:#DDD6F0;
  --green:#0C6B47; --green-mid:#128A5C; --green-soft:#E0EFE7;
  --brick:#9B4A32; --mute:#65685F;
}
[data-theme="dyslexic"] .read,
[data-theme="dyslexic"] .lcard p{letter-spacing:.04em;word-spacing:.1em;line-height:1.9}
[data-theme="dyslexic"] .lcard{font-size:17px}
[data-theme="adhd"] .lcard p{margin-bottom:1.4em}
[data-theme="adhd"] .finding{font-size:26px}
[data-theme="adhd"] .hook{font-size:25px;line-height:1.25}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2.5px solid var(--green);outline-offset:3px;border-radius:5px}

#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:34px;padding:20px}
#device{width:100%;max-width:414px;height:100%;max-height:896px;background:var(--card);
  position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:900px){
  #device{border-radius:38px;border:1px solid var(--line);
    box-shadow:0 40px 80px -30px rgba(22,24,29,.3),0 2px 0 rgba(255,255,255,.6) inset}
}
#console{display:none;flex-direction:column;width:360px;max-height:896px;height:100%}
#console[hidden]{display:none!important}

#streakbar{display:flex;align-items:center;gap:10px;width:100%;padding:10px 22px;flex:none;
  border-bottom:1px solid var(--line);background:var(--green-soft);color:var(--ink);
  font-family:var(--ui);font-size:13px;font-weight:600;text-align:left;line-height:1.2}
#streakbar[hidden]{display:none!important}
#streakbar.risk{background:rgba(155,74,50,.09);color:var(--brick)}
#streakbar .flame{width:19px;height:19px;flex:none;color:var(--green-mid)}
#streakbar .flame{color:var(--green-mid);transition:color .3s}
#streakbar.active .flame{animation:flicker 2.4s ease-in-out infinite}
#streakbar.risk .flame{color:var(--brick);animation:flamepulse 1.1s ease-in-out infinite}
#streakbar .n{font-family:var(--display);font-size:28px;font-weight:800;flex:none;color:inherit;line-height:1}
@keyframes flamepulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

.confetti-piece{position:absolute;width:7px;height:12px;top:0;left:0;pointer-events:none;z-index:95;
  opacity:0;animation:confetti-fall var(--dur,1100ms) cubic-bezier(.15,.6,.4,1) forwards}
@keyframes confetti-fall{
  0%{opacity:1;transform:translate(0,0) rotate(0deg)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}
}
.xppop{position:absolute;z-index:96;pointer-events:none;font-family:var(--display);font-weight:700;
  font-size:20px;color:var(--green);white-space:nowrap;left:0;top:0;
  animation:xppop 1150ms cubic-bezier(.2,.8,.2,1) forwards}
@keyframes xppop{
  0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}
  16%{opacity:1;transform:translate(-50%,-72%) scale(1.18)}
  32%{transform:translate(-50%,-82%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-170%) scale(1)}
}

#screen{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.pad{padding:26px 24px 28px}
#view{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--ink);

.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.btn.primary{background:var(--green)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);padding:9px 14px;border-radius:100px;font-size:14px;font-weight:500;
  min-height:42px;display:flex;align-items:center;transition:.14s}
.chip[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.chip.sm{font-size:12.5px;padding:7px 12px;min-height:36px}

/* dot calendar lives only on Progress now */
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:6px}
.dot{aspect-ratio:1;border-radius:50%;background:transparent;border:1.5px solid var(--line)}
.dot.on{background:var(--green);border-color:var(--green)}
.dot.miss{border-style:dotted;border-color:#C6BEB0}
.dot.today{border:2px solid var(--green-mid);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,138,92,.34)}50%{box-shadow:0 0 0 5px rgba(18,138,92,0)}}

/* ---------- illustrated cards ---------- */
.art{position:relative;overflow:hidden;background:var(--tint)}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.today-card{border:1.5px solid var(--line);border-radius:22px;overflow:hidden;background:var(--card)}
.today-card.shimmer{background:linear-gradient(120deg,var(--card) 30%,rgba(255,255,255,.9) 50%,var(--card) 70%);background-size:400% 100%;animation:shimmer 2.8s ease-in-out infinite}
.today-art{height:150px}
.stack{position:relative}

/* ---------- story deck ---------- */
/* ── TIKTOK DECK ─────────────────────────────────────────── */
#deck{position:absolute;inset:0;overflow-y:scroll;overflow-x:hidden;
  scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;
  background:transparent;overscroll-behavior:contain}
#deck::-webkit-scrollbar{display:none}
.deck-slide{height:100%;width:100%;flex:none;scroll-snap-align:start;
  display:flex;flex-direction:column;position:relative;
  background:var(--tint);overflow:hidden}
.deck-slide.entering{animation:slideup .35s cubic-bezier(.22,1,.36,1) both}
.segs{display:flex;gap:4px;padding:14px 16px 0;flex:none;position:relative;z-index:4}
.segs i{flex:1;height:3px;border-radius:99px;background:rgba(22,24,29,.16);overflow:hidden;transition:background .3s cubic-bezier(.34,1.2,.64,1)}

.deckbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;flex:none;position:relative;z-index:4}
.deckbar .btn{background:rgba(255,255,255,.66);border:0;color:var(--ink);backdrop-filter:blur(6px)}

.storybody.top{justify-content:flex-start;padding-top:8px}
.storybody button,.storybody a,.storybody textarea,.storybody .hlable{pointer-events:auto}
.storybody button[disabled]{pointer-events:none}
/* tapzones removed — TikTok swipe replaces them */
.lcard{animation:slideup .32s cubic-bezier(.22,1,.36,1) both;background:rgba(255,253,250,.88);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:20px;
  padding:22px 20px;box-shadow:0 10px 34px -16px rgba(22,24,29,.28)}
.lcard .lcard{box-shadow:none;background:rgba(255,253,250,.6)}
@keyframes rise{from{opacity:0;transform:translateY(48px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slideup{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
@keyframes slidedown{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardflip{0%{transform:rotateX(0deg)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0deg)}}
@keyframes greenwash{0%{background:var(--green-soft)}60%{background:rgba(12,107,71,.18)}100%{background:transparent}}

@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.08) rotate(-1deg)}50%{transform:scale(1.05) rotate(1deg)}75%{transform:scale(1.1) rotate(-0.5deg)}}
@keyframes streakpop{0%{transform:scale(1)}40%{transform:scale(1.32)}70%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes countup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes levelup{0%{opacity:0;transform:scale(.8) translateY(30px)}60%{transform:scale(1.04) translateY(-4px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.hook{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.18;letter-spacing:-.018em}
.finding{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.12;letter-spacing:-.02em;color:var(--tone)}
/* fab buttons removed — swipe navigation replaces them */

.sel{width:100%;text-align:left;border:1.5px solid rgba(22,24,29,.16);background:rgba(255,255,255,.72);

.sel:hover:not([disabled]){border-color:var(--ink)}
.sel[data-s="pick"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.sel[data-s="right"]{border-color:var(--green);background:var(--green);color:#fff;font-weight:600}
.sel[data-s="wrong"]{border-color:var(--brick);background:rgba(155,74,50,.09);color:var(--brick)}
.sel.shake{animation:shake .28s ease}
.sel.wash{animation:greenwash .65s ease forwards}
.quiz-result{animation:slideup .28s cubic-bezier(.22,1,.36,1) both}
.hl{background:rgba(18,138,92,.2);box-shadow:0 1.5px 0 rgba(12,107,71,.45);border-radius:2px}
.hlable{cursor:pointer}
.sticky-note{display:block;background:#FFF9C4;border-radius:3px 12px 12px 3px;

.rule{height:1px;background:var(--line);border:0;margin:22px 0}

.ob-screen{min-height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}

.row{display:flex;justify-content:space-between;align-items:center;gap:12px}

.topicbar{height:10px;border-radius:99px;background:var(--tone)}
.thumb{width:52px;height:52px;border-radius:12px;flex:none}

  box-shadow:0 10px 30px -8px rgba(0,0,0,.4)}
.sheet{position:absolute;inset:0;background:rgba(22,24,29,.44);z-index:90;display:flex;align-items:flex-end}
.sheet>div{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:24px;max-height:86%;

.cbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px}

<div id="stage">
  <div id="device">
    <button id="streakbar" data-a="tab:today" hidden></button>
    <div id="screen"><div class="pad" id="view"></div></div>
    <nav id="tabs" hidden aria-label="Main"></nav>
  </div>
  <aside id="console" aria-label="Stress test console">
    <h4>Stress console</h4>

<script>

/* =============================================================
   ONE THING, SERVER CORE
   Pure, dependency-free business logic. This module is the ONLY
   place that decides XP, streaks, assignment and eligibility.
   PRD §96: "The frontend displays state. The backend determines state."

   In production every function here runs inside a Postgres RPC or an
   Edge Function. The prototype calls the identical functions so the
   logic is proven once, not twice (PRD §95: no duplicated business logic).
   ============================================================= */

// ---------- date primitives ----------
// All day maths is done on CALENDAR DATE STRINGS, never on epoch deltas.
// FIX (crack #2): epoch arithmetic breaks on DST, a "day" can be 23h or 25h.

function pad(n) { return n < 10 ? '0' + n : '' + n; }

/** Local calendar date for a user, honouring a configurable day-start hour.
 *  dayStartHour = 0 is the literal calendar day the PRD specifies (§16).
 *  dayStartHour = 4 is the opt-in "night owl" boundary (see FIX #3). */
function localDate(utcMs, tzOffsetMin, dayStartHour) {
  dayStartHour = dayStartHour || 0;
  const shifted = utcMs + tzOffsetMin * 60000 - dayStartHour * 3600000;
  const d = new Date(shifted);
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
}

function parseDate(s) {
  const p = s.split('-').map(Number);
  return Date.UTC(p[0], p[1] - 1, p[2], 12, 0, 0); // noon anchor: DST-proof
}

function addDays(s, n) {
  const d = new Date(parseDate(s) + n * 86400000);
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
}

function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }

// ---------- level curve ----------
// FIX (crack #13): the PRD names six levels but defines no thresholds and
// no answer for what a 365-day user does at max level. Levels continue past
// Polymath with a repeating band so long-term users still see movement.
const LEVEL_NAMES = ['Curious', 'Explorer', 'Learner', 'Thinker', 'Scholar', 'Polymath'];
const LEVEL_THRESHOLDS = [0, 300, 900, 2000, 4200, 8000];

function levelFor(xp) {
  let i = 0;
  while (i + 1 < LEVEL_THRESHOLDS.length && xp >= LEVEL_THRESHOLDS[i + 1]) i++;
  if (i === LEVEL_THRESHOLDS.length - 1) {
    // Polymath II, III … every 6000 XP beyond the last threshold.
    const over = Math.floor((xp - LEVEL_THRESHOLDS[i]) / 6000);
    const next = LEVEL_THRESHOLDS[i] + (over + 1) * 6000;
    const prev = LEVEL_THRESHOLDS[i] + over * 6000;
    return {
      level: 6 + over,
      name: LEVEL_NAMES[5] + (over ? ' ' + roman(over + 1) : ''),
      floor: prev, ceiling: next,
      progress: (xp - prev) / (next - prev)
    };
  }
  const prev = LEVEL_THRESHOLDS[i], next = LEVEL_THRESHOLDS[i + 1];
  return {
    level: i + 1, name: LEVEL_NAMES[i], floor: prev, ceiling: next,
    progress: (xp - prev) / (next - prev)
  };
}
function roman(n) { return ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'][n] || ('x' + n); }

// ---------- recommendation ----------
// FIX (crack #22): the PRD scores "- Previously Seen" as a penalty. On a
// one-item-per-day product a repeat is 100% of that day, so seen content is
// a HARD FILTER, not a subtraction. Score only ranks eligible candidates.

// Adjacency is the tier-1 fallback, so every topic offered in onboarding MUST
// appear here, and every name used here MUST be a real topic. A topic missing
// from this map silently collapses to the global tier and the user stops being
// personalised at all. Both invariants are asserted in the test suite
// ("every topic offered in onboarding has an adjacency entry", "adjacency is
// symmetric", "no topic is an island"), because the failure is invisible at
// runtime: the user simply stops being personalised and nothing errors.
// Edges are UNDIRECTED. The original map was one-way in sixteen places, so
// Science listed nothing of Technology while Technology listed Science, and a
// Science-only reader never saw the adjacent tier the other side offered.
const ADJACENT = {
  Science:     ['Technology', 'Space', 'Nature', 'Environment', 'Health', 'Sleep'],
  Technology:  ['Science', 'AI', 'Engineering', 'Aeronautics', 'Education', 'Business'],
  AI:          ['Technology', 'Engineering', 'Philosophy', 'Movies'],
  Engineering: ['Technology', 'AI', 'Aeronautics', 'Space', 'Design'],
  Aeronautics: ['Technology', 'Engineering', 'Space', 'Design'],
  Space:       ['Science', 'Engineering', 'Aeronautics', 'Nature'],
  Nature:      ['Science', 'Space', 'Environment', 'Health', 'Sleep'],
  Environment: ['Science', 'Nature', 'Society'],
  Health:      ['Science', 'Nature', 'Sleep', 'Beauty', 'Psychology'],
  Sleep:       ['Science', 'Nature', 'Health', 'Psychology'],
  Beauty:      ['Health', 'Culture', 'Design'],
  Psychology:  ['Health', 'Sleep', 'Philosophy', 'Society', 'Education', 'Finance'],
  Philosophy:  ['AI', 'Psychology', 'Society', 'History', 'Books'],
  Society:     ['Environment', 'Psychology', 'Philosophy', 'History', 'Economics', 'Finance'],
  History:     ['Philosophy', 'Society', 'Culture', 'Arts', 'Books', 'Economics'],
  Culture:     ['Beauty', 'History', 'Arts', 'Books', 'Movies'],
  Arts:        ['History', 'Culture', 'Books', 'Movies', 'Design'],
  Books:       ['Philosophy', 'History', 'Culture', 'Arts', 'Education'],
  Movies:      ['AI', 'Culture', 'Arts', 'Design'],
  Design:      ['Engineering', 'Aeronautics', 'Beauty', 'Arts', 'Movies'],
  Education:   ['Technology', 'Psychology', 'Books'],
  Business:    ['Technology', 'Economics', 'Finance'],
  Economics:   ['Society', 'History', 'Business', 'Finance'],
  Finance:     ['Psychology', 'Society', 'Business', 'Economics']
};

const DIFF_RANK = { Beginner: 1, Balanced: 2, Challenging: 3 };

/** Returns { contentId, tier, confidence, why[] } and NEVER null while the
 *  corpus is non-empty (PRD §47/§80). tier 0=interest 1=adjacent 2=global
 *  3=evergreen emergency 4=revisit. */
function recommend(opts) {
  const corpus = opts.corpus, profile = opts.profile;
  const seen = new Set(opts.seenIds || []);
  const recentTopics = opts.recentTopics || []; // newest first
  const skipped = new Set(opts.skippedIds || []);
  const rand = opts.rand || (() => 0.5);

  const interests = new Set(profile.interests || []);
  const adjacent = new Set();
  interests.forEach(t => (ADJACENT[t] || []).forEach(a => { if (!interests.has(a)) adjacent.add(a); }));

  // Consecutive-topic run drives the diversity term (PRD §40).
  let run = 0;
  if (recentTopics.length) {
    const head = recentTopics[0];
    while (run < recentTopics.length && recentTopics[run] === head) run++;
  }
  const staleTopic = run >= 2 ? recentTopics[0] : null;

  const wantRank = DIFF_RANK[profile.difficulty] || 2;
  const approved = corpus.filter(c => c.status === 'approved' && (c.year == null || c.year >= 2000));

  function score(c) {
    const why = [];
    let s = 0;
    if (interests.has(c.topic)) { s += 40; why.push('matches your interest in ' + c.topic); }
    else if (adjacent.has(c.topic)) { s += 18; why.push(c.topic + ' sits next to what you follow'); }

    // Affinity is suppressed for the subject the user is stuck on. Otherwise
    // the behavioural loop that §41 creates directly defeats the diversity
    // rule §40 asks for: liking Psychology makes you see only Psychology,
    // which raises your Psychology affinity, and so on.
    if (c.topic !== staleTopic) {
      const affinity = (profile.affinity && profile.affinity[c.topic]) || 0;
      s += Math.max(-15, Math.min(20, affinity * 4));
      if (affinity >= 3) why.push('you finish ' + c.topic + ' pieces');
    }

    s += (c.quality - 70) * 0.6;
    if (c.quality >= 88) why.push('unusually strong source');

    const gap = Math.abs((DIFF_RANK[c.difficulty] || 2) - wantRank);
    s += gap === 0 ? 14 : gap === 1 ? 4 : -12;

    if (c.minutes === profile.duration) s += 8;
    else if (Math.abs(c.minutes - profile.duration) <= 5) s += 3;
    else s -= 6;

    // Escalating, so a longer rut is harder to stay in.
    if (staleTopic && c.topic === staleTopic) { s -= (20 + run * 10); }
    else if (staleTopic) { s += 14; why.push('a change of subject'); }

    if (skipped.has(c.id)) s -= 25;

    // Exploration. FIX (crack #24): on a one-a-day product a bad exploration
    // day costs the user 100% of their day, so it is throttled and never
    // fires during the fragile first week.
    if ((opts.streak || 0) >= 7 && !interests.has(c.topic) && rand() < 0.14) {
      s += 22; why.push('a deliberate detour outside your usual topics');
    }
    return { s, why };
  }

  function best(pool, tier) {
    if (!pool.length) return null;
    const ranked = pool.map(c => {
      const r = score(c);
      return { c, s: r.s, why: r.why };
    }).sort((a, b) => b.s - a.s);
    const top = ranked[0];
    const spread = ranked.length > 1 ? top.s - ranked[ranked.length - 1].s : 1;
    return {
      contentId: top.c.id, tier: tier,
      confidence: Math.max(0.05, Math.min(0.99, 0.45 + (top.s / 120) * 0.5)),
      why: top.why.length ? top.why : ['picked from approved general content'],
      margin: spread
    };
  }

  const unseen = approved.filter(c => !seen.has(c.id));

  // PRD §40. After a run of the same subject the candidate pool widens so the
  // diversity term can actually outrank interest match. Without this the tiers
  // are a strict cascade and a single-interest user is served that one subject
  // forever, which is precisely the failure §40 exists to prevent.
  if (staleTopic) {
    const widened = best(unseen, 0);
    if (widened) return widened;
  }

  return best(unseen.filter(c => interests.has(c.topic)), 0)
    || best(unseen.filter(c => adjacent.has(c.topic)), 1)
    || best(unseen, 2)
    // The emergency pool must still respect "not seen", otherwise it silently
    // re-serves old content without telling the user it is a revisit.
    || best(approved.filter(c => c.evergreen && !seen.has(c.id)), 3)
    // FIX (crack #7): the PRD has no answer for a user who has seen
    // everything eligible. Rather than break the daily promise, the oldest
    // completed item returns explicitly flagged as a revisit.
    || best(approved.slice().sort((a, b) =>
        (opts.lastSeenAt?.[a.id] || 0) - (opts.lastSeenAt?.[b.id] || 0)).slice(0, 1), 4);
}

// ---------- daily assignment ----------
/** PRD §15/§17. Server decides the date; the client's opinion is ignored. */
function getOrCreateAssignment(db, user, nowMs, requestedDate) {
  const today = localDate(nowMs, user.tzOffsetMin, user.dayStartHour);

  // FIX (crack #1): a user flying west can move their local date BACKWARDS.
  // Without this the same person gets a second "fresh" day and a second
  // streak increment. The effective day never regresses below the last day
  // the server already opened for them.
  let effective = today;
  if (user.lastActiveLocalDate && daysBetween(user.lastActiveLocalDate, today) < 0) {
    effective = user.lastActiveLocalDate;
  }

  if (requestedDate && requestedDate !== effective) {
    if (daysBetween(effective, requestedDate) > 0) {
      return { error: 'FUTURE_CONTENT_LOCKED', status: 403, date: effective };
    }
    const past = db.assignments.find(a => a.userId === user.id && a.localDate === requestedDate);
    return past ? { assignment: past, readOnly: true } : { error: 'NOT_FOUND', status: 404 };
  }

  const existing = db.assignments.find(a => a.userId === user.id && a.localDate === effective);
  if (existing) return { assignment: existing, created: false };

  const mine = db.assignments.filter(a => a.userId === user.id);
  const seenIds = mine.map(a => a.contentId);
  const lastSeenAt = {};
  mine.forEach(a => { lastSeenAt[a.contentId] = parseDate(a.localDate); });
  const recentTopics = mine.slice()
    .sort((x, y) => (x.localDate < y.localDate ? 1 : x.localDate > y.localDate ? -1 : 0)) // newest first
    .map(a => (db.corpus.find(c => c.id === a.contentId) || {}).topic);

  const rec = recommend({
    corpus: db.corpus, profile: user, seenIds, recentTopics, lastSeenAt,
    skippedIds: user.skippedIds, streak: user.currentStreak, rand: db.rand
  });
  if (!rec) return { error: 'NO_CONTENT', status: 503 };

  const a = {
    id: 'dl_' + user.id + '_' + effective,
    userId: user.id, contentId: rec.contentId, localDate: effective,
    tzOffsetMin: user.tzOffsetMin,        // frozen at assignment time
    dayStartHour: user.dayStartHour || 0, // frozen at assignment time
    status: 'assigned', assignedAt: nowMs, startedAt: null, completedAt: null,
    tier: rec.tier, confidence: rec.confidence, why: rec.why,
    quizScore: null, xpEarned: 0, revisit: rec.tier === 4
  };
  // Simulates the ON CONFLICT DO NOTHING guard behind UNIQUE(user_id, local_date).
  if (db.assignments.some(x => x.userId === user.id && x.localDate === effective)) {
    return { assignment: db.assignments.find(x => x.userId === user.id && x.localDate === effective), created: false };
  }
  db.assignments.push(a);
  user.lastActiveLocalDate = effective;
  return { assignment: a, created: true };
}

// ---------- completion ----------
const XP = {
  complete: 100, quiz: 25, perfectQuiz: 25, reflection: 10, firstTopic: 20,
  firstTopicCap: 6 // FIX (crack #12): "+20 per first-time topic" x 24 topics
                   // is farmable by picking every interest. Capped.
};

/** Grades server-side from the server's copy of the answers.
 *  FIX (crack #36): correct answers must never reach the client. */
function gradeQuiz(content, answers) {
  const qs = content.quiz || [];
  let correct = 0;
  const detail = qs.map((q, i) => {
    const ok = answers && answers[i] === q.correct;
    if (ok) correct++;
    return { i, ok: !!ok, correct: q.correct, explain: q.explain };
  });
  return { correct, total: qs.length, detail, perfect: qs.length > 0 && correct === qs.length };
}

/** PRD §23/§49/§51/§98. Idempotent: safe to call twice with the same key. */
function completeLearning(db, user, nowMs, payload) {
  const a = db.assignments.find(x => x.userId === user.id && x.localDate === payload.localDate);
  if (!a) return { error: 'NO_ASSIGNMENT', status: 404 };
  if (!a.startedAt) return { error: 'NOT_STARTED', status: 409 };

  // ---- idempotency (PRD §98) ----
  if (a.status === 'completed') {
    return {
      idempotent: true, assignment: a, xpAwarded: 0,
      streak: { current: user.currentStreak, longest: user.longestStreak, changed: false },
      grade: a.grade, receipt: a.receipt
    };
  }

  // ---- late / offline sync window ----
  // FIX (crack #9): the PRD says server timestamps are authoritative AND that
  // offline completions are queued for later sync. Those contradict: an honest
  // offline finisher loses the streak. A client-claimed finish time is honoured
  // only if the session start was witnessed by the server on that same local
  // day and the claim is inside a bounded window.
  const serverDate = localDate(nowMs, a.tzOffsetMin, a.dayStartHour);
  let acceptedAsOfflineSync = false;
  if (serverDate !== a.localDate) {
    const claimed = payload.clientCompletedAt;
    const graceMs = 12 * 3600000;  // covers 'finished before bed, synced on waking'
    const dayEnd = parseDate(addDays(a.localDate, 1)) - 12 * 3600000
      - a.tzOffsetMin * 60000 + (a.dayStartHour || 0) * 3600000;
    const withinGrace = nowMs - dayEnd <= graceMs;
    const claimInDay = claimed && localDate(claimed, a.tzOffsetMin, a.dayStartHour) === a.localDate;
    if (payload.offlineSync && claimed && claimInDay && withinGrace && daysBetween(a.localDate, serverDate) === 1) {
      acceptedAsOfflineSync = true;
    } else {
      return { error: 'DAY_CLOSED', status: 410, date: a.localDate };
    }
  }

  const content = db.corpus.find(c => c.id === a.contentId);
  const grade = gradeQuiz(content, payload.quizAnswers);
  if (grade.total > 0 && (!payload.quizAnswers || payload.quizAnswers.filter(x => x !== null && x !== undefined).length < grade.total)) {
    return { error: 'QUIZ_INCOMPLETE', status: 409 };
  }

  // ---- XP, written as transactions (PRD §72) ----
  const lines = [];
  const push = (reason, amount) => {
    const key = user.id + ':' + a.id + ':' + reason;
    if (db.xp.some(t => t.key === key)) return;      // replay guard
    db.xp.push({ key, userId: user.id, amount, reason, ref: a.id, at: nowMs });
    lines.push({ reason, amount });
  };

  push('complete_daily', XP.complete);
  // FIX (crack #8 follow-on): a revisit is content this user has already
  // completed once, so its quiz is a test they have already been given the
  // answers to. Paying quiz and perfect-quiz XP again makes the ceiling
  // permanently farmable the moment the library is exhausted, which §49
  // forbids. Completing still pays in full, because the daily habit is the
  // product and the streak must survive an exhausted library.
  if (grade.total > 0 && !a.revisit) {
    push('complete_quiz', XP.quiz);
    if (grade.perfect) push('perfect_quiz', XP.perfectQuiz);
  }
  // FIX (crack #11): the PRD awards XP for a "meaningful" reflection. Nothing
  // can judge meaning cheaply or fairly, and an LLM gate would reject honest
  // short answers. A low objective floor, and the UI never says "meaningful".
  if (payload.reflection && payload.reflection.trim().length >= 40 &&
      new Set(payload.reflection.replace(/\s/g, '')).size >= 8) {
    push('reflection', XP.reflection);
  }
  const priorTopics = new Set(db.assignments
    .filter(x => x.userId === user.id && x.status === 'completed' && x.id !== a.id)
    .map(x => (db.corpus.find(c => c.id === x.contentId) || {}).topic));
  const firstTopicAwards = db.xp.filter(t => t.userId === user.id && t.reason === 'first_topic').length;
  if (content && !priorTopics.has(content.topic) && firstTopicAwards < XP.firstTopicCap) {
    push('first_topic', XP.firstTopic);
  }

  const xpAwarded = lines.reduce((s, l) => s + l.amount, 0);
  user.xp = db.xp.filter(t => t.userId === user.id).reduce((s, t) => s + t.amount, 0);

  // ---- streak ----
  const prev = user.lastCompletedLocalDate;
  const before = user.currentStreak || 0;
  let gap = prev ? daysBetween(prev, a.localDate) : null;

  // FIX (crack #6): flying EAST skips a calendar date through no fault of the
  // user. If the timezone moved forward enough to explain exactly one lost
  // day, that day is bridged rather than punished.
  let bridged = false;
  if (gap === 2 && user.prevTzOffsetMin != null &&
      (user.tzOffsetMin - user.prevTzOffsetMin) >= 8 * 60) { gap = 1; bridged = true; }

  if (gap === 0) { /* unreachable: idempotency catches it */ }
  else if (gap === 1) user.currentStreak = before + 1;
  else user.currentStreak = 1;
  user.longestStreak = Math.max(user.longestStreak || 0, user.currentStreak);
  user.lastCompletedLocalDate = a.localDate;

  a.status = 'completed';
  a.completedAt = acceptedAsOfflineSync ? payload.clientCompletedAt : nowMs;
  a.quizScore = grade.total ? grade.correct / grade.total : null;
  a.xpEarned = xpAwarded;
  a.grade = grade;
  a.reflection = payload.reflection || null;

  // affinity update (PRD §41)
  if (content) {
    user.affinity = user.affinity || {};
    const bump = 1 + (grade.perfect ? 0.5 : 0) + (payload.bookmarked ? 0.5 : 0);
    user.affinity[content.topic] = (user.affinity[content.topic] || 0) + bump;
  }

  const unlocked = checkAchievements(db, user);
  a.receipt = {
    lines, xpAwarded, streak: user.currentStreak, bridged,
    offlineSync: acceptedAsOfflineSync, unlocked, level: levelFor(user.xp)
  };
  return {
    assignment: a, xpAwarded, lines, grade, unlocked, bridged,
    offlineSync: acceptedAsOfflineSync,
    streak: { current: user.currentStreak, longest: user.longestStreak, changed: true, previous: before },
    level: levelFor(user.xp), receipt: a.receipt
  };
}

/** FIX (crack #33): the PRD keeps current_streak as mutable state with no
 *  repair path. Completions are the source of truth; this recomputes and is
 *  run nightly to heal drift. */
function recomputeStreak(db, user, todayLocal) {
  const days = db.assignments
    .filter(a => a.userId === user.id && a.status === 'completed')
    .map(a => a.localDate).sort();
  if (!days.length) return { current: 0, longest: 0, last: null };
  let longest = 1, run = 1;
  for (let i = 1; i < days.length; i++) {
    if (daysBetween(days[i - 1], days[i]) === 1) run++; else run = 1;
    longest = Math.max(longest, run);
  }
  const last = days[days.length - 1];
  let current = 1;
  for (let i = days.length - 1; i > 0; i--) {
    if (daysBetween(days[i - 1], days[i]) === 1) current++; else break;
  }
  // A streak is only alive if the last completion was today or yesterday.
  const alive = todayLocal ? daysBetween(last, todayLocal) <= 1 : true;
  return { current: alive ? current : 0, longest, last };
}

// ---------- achievements ----------
const ACHIEVEMENTS = [
  { id: 'first_thing', name: 'First Thing', desc: 'Finish your first one.', test: s => s.completed >= 1 },
  { id: 'week_one', name: 'Week One', desc: 'Seven days in a row.', test: s => s.longest >= 7 },
  { id: 'deep_diver', name: 'Deep Diver', desc: 'Ten pieces in a single subject.', test: s => s.maxTopic >= 10 },
  { id: 'explorer', name: 'Explorer', desc: 'Five different subjects.', test: s => s.topics >= 5 },
  { id: 'polymath', name: 'Polymath', desc: 'Ten different subjects.', test: s => s.topics >= 10 },
  { id: 'critical_thinker', name: 'Critical Thinker', desc: 'Full marks, five times.', test: s => s.perfects >= 5 },
  { id: 'century', name: 'Century', desc: 'A hundred things kept.', test: s => s.completed >= 100 }
];

function statsFor(db, user) {
  const done = db.assignments.filter(a => a.userId === user.id && a.status === 'completed');
  const byTopic = {};
  done.forEach(a => {
    const c = db.corpus.find(x => x.id === a.contentId);
    if (c) byTopic[c.topic] = (byTopic[c.topic] || 0) + 1;
  });
  return {
    completed: done.length,
    topics: Object.keys(byTopic).length,
    maxTopic: Object.values(byTopic).reduce((m, v) => Math.max(m, v), 0),
    perfects: done.filter(a => a.grade && a.grade.perfect).length,
    longest: user.longestStreak || 0,
    byTopic
  };
}

function checkAchievements(db, user) {
  const s = statsFor(db, user);
  user.achievements = user.achievements || [];
  const newly = [];
  ACHIEVEMENTS.forEach(a => {
    if (!user.achievements.includes(a.id) && a.test(s)) { user.achievements.push(a.id); newly.push(a); }
  });
  return newly;
}

/** FIX (crack #36, client half): what the browser is allowed to receive. */
function toClientPayload(content) {
  if (!content) return null;
  const out = JSON.parse(JSON.stringify(content));
  (out.quiz || []).forEach(q => { delete q.correct; delete q.explain; });
  return out;
}

const CORE = {
  localDate, addDays, daysBetween, parseDate, levelFor, LEVEL_NAMES, LEVEL_THRESHOLDS,
  recommend, getOrCreateAssignment, completeLearning, recomputeStreak, gradeQuiz,
  toClientPayload, checkAchievements, statsFor, ACHIEVEMENTS, ADJACENT, XP
};
if (typeof module !== 'undefined') module.exports = CORE;
if (typeof window !== 'undefined') window.CORE = CORE;

   (a network for the fungal study, gears for the Antikythera
   mechanism, a plasma wave for Voyager), and the colour tells you
   at a glance which subject you are in.
   Deterministic from the item id, so a piece always looks the same.
   ============================================================= */
function rng(seed){let s=0;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;
  return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

function motif(kind,pal,seed,w,hgt){

    const cx=W*.22,cy=H*.5;
    for(let i=1;i<=7;i++)p.push(`<circle cx="${cx}" cy="${cy}" r="${i*W*.105}" fill="none" stroke="${a}" stroke-width="${2.4-i*.22}" opacity="${.62-i*.06}"/>`);
    p.push(`<circle cx="${cx}" cy="${cy}" r="7" fill="${a}"/>`);
  } else if(kind==='strata'){               // layers laid down over time
    for(let i=0;i<9;i++){const y=H*.16+i*H*.085;
      p.push(`<path d="M0 ${y} C ${W*.3} ${y+R(-13,13)}, ${W*.65} ${y+R(-13,13)}, ${W} ${y+R(-7,7)}" fill="none" stroke="${a}" stroke-width="${i%3===0?2.4:1.1}" opacity="${.2+i*.055}"/>`);}
  } else if(kind==='bloom'){                // something opening out
    const cx=W*.5,cy=H*.54;
    for(let i=0;i<14;i++){const ang=i*(Math.PI*2/14),len=H*.34*(.55+r()*.45);
      p.push(`<ellipse cx="${cx+Math.cos(ang)*len*.5}" cy="${cy+Math.sin(ang)*len*.5}" rx="${len*.45}" ry="${len*.15}" fill="${a}" opacity=".16" transform="rotate(${ang*180/Math.PI} ${cx+Math.cos(ang)*len*.5} ${cy+Math.sin(ang)*len*.5})"/>`);}
    p.push(`<circle cx="${cx}" cy="${cy}" r="${H*.08}" fill="${a}" opacity=".5"/>`);
  } else if(kind==='orbit'){                // a small body, a long way out
    p.push(`<circle cx="${W*.5}" cy="${H*.5}" r="${H*.09}" fill="${a}" opacity=".55"/>`);
    for(let i=0;i<4;i++){const rx=H*(.2+i*.16),ry=H*(.1+i*.07),rot=R(-38,38);

    for(let i=0;i<16;i++)p.push(`<circle cx="${R(0,W)}" cy="${R(0,H)}" r="${R(.7,1.9)}" fill="${a}" opacity="${R(.2,.55)}"/>`);

    p.push(`<path d="M${W*.06} ${H*.3} L ${W*.94} ${H*.68}" fill="none" stroke="${a}" stroke-width="2" opacity=".33" stroke-dasharray="7 6"/>`);

    for(let i=0;i<14;i++){const x=W*.07+i*W*.062,hh=H*(.3+r()*.34),w=W*(.028+r()*.02);
      p.push(`<rect x="${x}" y="${H*.74-hh}" width="${w}" height="${hh}" rx="2" fill="${a}" opacity="${.24+r()*.42}"/>`);

function haptic(type){
  if(!navigator.vibrate) return;
  if(type==='correct') navigator.vibrate(10);
  else if(type==='wrong') navigator.vibrate([12,8,12]);
  else if(type==='complete') navigator.vibrate([15,10,30]);
  else if(type==='levelup') navigator.vibrate([20,15,40,15,80]);
  else if(type==='milestone') navigator.vibrate([30,20,60]);
}

/* ── STREAK HELPERS ──────────────────────────────────────────── */
function animateCountUp(el, from, to, duration){
  if(!el || from === to) { if(el) el.textContent = to; return; }
  const start = performance.now();
  function step(now){
    const p = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * ease);
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = to;
  }
  requestAnimationFrame(step);
}

function checkStreakMilestone(streak){
  const milestones = [3, 7, 14, 30, 100];
  return milestones.includes(streak);
}

  /* ── STEP 2: SUBTOPICS ───────────────────────────────────── */
  if(st===2){
    const avail=u.interests.filter(t=>SUBS[t]);
    if(!avail.length){ S.step=3; return vwOnboard(); }
    return `<div class="ob-screen" style="background:var(--ground)">
      <div class="ob-bg">${obBg('dots')}</div>
      <div class="ob-content">
        ${obProgress(2,TOTAL)}
        <div style="position:relative">
          <span class="ob-num">02</span>

      </div>
      <div class="ob-footer">
        <button class="btn primary" data-a="next">Continue</button>
        <button class="btn ghost" data-a="next" style="margin-top:9px">Nothing jumps out</button>
      </div>
    </div>`;
  }

  /* ── STEP 3: DURATION ────────────────────────────────────── */
  if(st===3){
    const opts=[
      [5,'circle-sm','Five minutes','The length of a coffee queue'],
      [10,'circle-md','Ten minutes','Where most days land'],
      [15,'circle-rings','Fifteen minutes','When you want the method too']
    ];
    return `<div class="ob-screen" style="background:var(--ground)">
      <div class="ob-bg">${obBg('arc')}</div>
      <div class="ob-content">
        ${obProgress(3,TOTAL)}
        <div style="position:relative">
          <span class="ob-num">03</span>
          <span class="ob-eyebrow">Your time</span>
          <h2 class="ob-headline" style="font-size:clamp(24px,7vw,30px)">How long have you got?</h2>

        </div>
        ${opts.map(([m,glyph,t,x])=>`<button class="sel" data-dur="${m}" data-s="${u.duration===m?'pick':''}" style="text-align:left;display:flex;align-items:center;gap:16px;padding:16px 18px">
          <span style="color:var(--green);flex:none">${obGlyph(glyph)}</span>

        </button>`).join('')}
      </div>
      <div class="ob-footer">
        <button class="btn primary" data-a="next">Continue</button>
      </div>
    </div>`;
  }

  /* ── STEP 4: DIFFICULTY ──────────────────────────────────── */
  if(st===4){
    const opts=[
      ['Beginner','dot','From scratch','Assume I know nothing about it'],
      ['Balanced','ring','Straight to it','Assume I\u2019m curious and paying attention'],
      ['Challenging','deep','Show your working','I want the evidence, not just the answer']
    ];
    return `<div class="ob-screen" style="background:var(--ground)">
      <div class="ob-bg">${obBg('rings')}</div>
      <div class="ob-content">
        ${obProgress(4,TOTAL)}
        <div style="position:relative">
          <span class="ob-num">04</span>
          <span class="ob-eyebrow">Depth</span>
          <h2 class="ob-headline" style="font-size:clamp(24px,7vw,30px)">How deep should we go?</h2>
          <p class="ob-body">Get a few wrong and we'll ease off. Nothing here is locked in.</p>
        </div>
        ${opts.map(([d,glyph,t,x])=>`<button class="sel" data-diff="${d}" data-s="${u.difficulty===d?'pick':''}" style="text-align:left;display:flex;align-items:center;gap:16px;padding:16px 18px">
          <span style="color:var(--green);flex:none">${obGlyph(glyph)}</span>
          <span><strong style="display:block;margin-bottom:2px">${t}</strong><span class="small">${x}</span></span>
        </button>`).join('')}
      </div>
      <div class="ob-footer">
        <button class="btn primary" data-a="next">Continue</button>
      </div>
    </div>`;
  }

  /* ── STEP 5: AUTH ────────────────────────────────────────── */
  const authState = S._authFlow || 'idle';
  const googleSVG = `<svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.909-2.259c-.806.54-1.837.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>`;

  return `<div class="auth-screen">
    <div class="ob-bg">${obBg('rings')}</div>
    <div style="position:relative;z-index:1;flex:1;display:flex;flex-direction:column">
      <div style="margin-bottom:32px">

      </div>
      ${authState==='email_sent'?`
        <div style="background:white;border-radius:16px;padding:20px;margin-bottom:20px;border:1.5px solid var(--green)">
          <p style="font-weight:700;margin:0 0 6px;color:var(--green)">Check your email.</p>

          autocomplete="email" autofocus>

          ${googleSVG} Continue with Google

/* ============ THE STORY DECK ============ */
const LABEL={context:"Here's the backstory",evidence:'What happened',finding:'The discovery',matters:'Why this changes things'};

function vwLearn(){
  const a=S.assignments.find(x=>x.id===L.aid), c=content(a.contentId);
  const total=c.cards.length+c.quiz.length+1;
  const step=L.idx<c.cards.length?L.idx:(L.idx===c.cards.length?c.cards.length+(L.qi||0):total-1);
  const segs=Array.from({length:total},(_,n)=>`<i class="${n<=step?'done':''}"></i>`).join('');
  const head=`<div class="deckbar">
      <button class="btn tiny ghost" data-a="exit" aria-label="Close">Close</button>
      <div class="segs" style="flex:1;padding:0 12px">${segs}</div>
      <button class="btn tiny ghost" data-a="bookmark">${S.bookmarks.includes(c.id)?'Saved':'Save'}</button>
    </div>`;

  /* Build all slides as full-height snap children */
  const slides = [];

  /* ── READING CARDS ── */
  c.cards.forEach((card, idx) => {
    let body='', isCenter=true;
    if(card.t==='hook'){
      body=`<div class="lcard"><p class="hook" style="margin:0">${h(card.text)}</p></div>`;
    } else if(card.t==='finding'){
      body=`<div class="lcard"><span class="eyebrow tone">The discovery</span>
        <p class="finding" style="margin:16px 0 0">${hlText(card.text,c.id,idx)}</p></div>`;
    } else {
      isCenter=false;
      body=`<div class="lcard"><span class="eyebrow tone">${h(LABEL[card.t]||'')}</span>
        <p class="read" style="margin:16px 0 0;font-size:16px;line-height:1.75">${hlText(card.text,c.id,idx)}</p>
        ${card.t==='matters'&&c.uncertainty?`<div class="note warn" style="margin-top:18px">
          <strong>Still argued</strong><br>${h(c.uncertainty)}</div>`:''}
        <p class="small" style="margin-top:20px;opacity:.5">Swipe up to continue · Tap a line to keep it</p>
      </div>`;
    }
    slides.push(`<div class="deck-slide" style="${tone(c)}">
      <div class="storyart">${motif(c.motif,c.pal,c.id,420,880)}</div>
      ${idx===0?head:'<div class="deckbar" style="justify-content:flex-end">'+
        `<div class="segs" style="flex:1;padding:0 12px">${Array.from({length:total},(_,n)=>`<i class="${n<=idx?'done':''}"></i>`).join('')}</div>`+
        `<button class="btn tiny ghost" data-a="bookmark">${S.bookmarks.includes(c.id)?'Saved':'Save'}</button></div>`}
      <div class="storybody ${isCenter?'':'top'}">${body}</div>
    </div>`);
  });

  /* ── QUIZ SLIDES ── */
  c.quiz.forEach((cur, q) => {
    const ans=L.qa[q], graded=L.qgrade&&L.qgrade[q];
    const canSubmit=ans!=null&&!graded;
    const cardIdx=c.cards.length;
    body=`<div class="lcard">
      <span class="eyebrow tone">Quick check · ${q+1} of ${c.quiz.length}</span>
      <h2 style="margin:14px 0 20px;font-size:21px;line-height:1.25">${h(cur.q)}</h2>
      ${cur.options.map((o,n)=>{
        let st='';
        if(graded) st=n===graded.correct?'right':(n===ans?'wrong':'');
        else if(ans===n) st='pick';
        return `<button class="sel" data-ans="${n}" data-s="${st}" ${graded?'disabled':''}>${h(o)}</button>`;
      }).join('')}
      ${graded?`<div class="lcard quiz-result ${graded.ok?'note':'note warn'}" style="margin-top:16px">
        <strong>${graded.ok?"That's it.":'Not this time.'}</strong> ${h(graded.explain)}
        ${!graded.ok?`<p style="margin:12px 0 0;font-size:13px;opacity:.7">Swipe up to continue</p>`:''}
      </div>`
      :`<button class="btn" style="margin-top:18px;width:100%" data-a="grade" ${ans==null?'disabled':''}>Check my answer</button>`}
    </div>`;
    const segI=cardIdx+q;
    slides.push(`<div class="deck-slide" style="${tone(c)}" data-quiz="${q}">
      <div class="storyart">${motif(c.motif,c.pal,c.id,420,880)}</div>
      <div class="deckbar">
        <button class="btn tiny ghost" data-a="exit">Close</button>
        <div class="segs" style="flex:1;padding:0 12px">${Array.from({length:total},(_,n)=>`<i class="${n<=segI?'done':''}"></i>`).join('')}</div>
        <button class="btn tiny ghost" data-a="bookmark">${S.bookmarks.includes(c.id)?'Saved':'Save'}</button>
      </div>
      <div class="storybody top">${body}</div>
    </div>`);
  });

  /* ── SOURCE + FINISH SLIDE ── */
  const s=c.source;
  slides.push(`<div class="deck-slide" style="${tone(c)}" data-finish="1">
    <div class="storyart">${motif(c.motif,c.pal,c.id,420,880)}</div>
    <div class="deckbar">
      <button class="btn tiny ghost" data-a="exit">Close</button>
      <div class="segs" style="flex:1;padding:0 12px">${Array.from({length:total},(_,n)=>`<i class="done"></i>`).join('')}</div>
    </div>
    <div class="storybody">
      <div class="lcard">
        <span class="eyebrow tone">The paper</span>
        <h3 style="margin:16px 0 10px;font-size:19px;line-height:1.3">${h(s.title)}</h3>
        <p class="small" style="margin:0 0 20px">${h(s.authors)}, ${s.year}</p>
        <a class="btn ghost" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px"
          href="${h(s.url)}" target="_blank" rel="noopener">Read the original</a>
        <button class="btn primary" style="width:100%" data-a="finish">Finish &amp; see your streak</button>
      </div>
    </div>
  </div>`);

  return `<div id="deck">${slides.join('')}</div>`;
}


function hlText(text,cid,ci){
  return sentences(text).map((s,si)=>{
    const on=S.highlights.some(x=>x.k===hlKey(cid,ci,si));
    return `<span class="hlable ${on?'hl':''}" data-hl="${hlKey(cid,ci,si)}" data-t="${h(s.trim())}">${h(s)}</span>`;
  }).join('');
}

/* ============ LIBRARY ============ */
function vwLibrary(){
  const tab=S.libTab||'history';
  const done=S.assignments.filter(a=>a.status==='completed');
  const missed=S.assignments.filter(a=>a.status!=='completed'&&a.localDate<today());
  const all=[...done,...missed].sort((a,b)=>b.localDate.localeCompare(a.localDate));
  const t=(k,l,n)=>`<button class="chip sm" data-lib="${k}" aria-pressed="${tab===k}">${l}${n?' '+n:''}</button>`;
  let body='';
  if(tab==='history'){
    body = all.length? all.map(a=>{const c=content(a.contentId);return `
      <button class="today-card" style="width:100%;text-align:left;margin-bottom:11px;display:flex;gap:14px;align-items:center;padding:14px" data-open="${a.localDate}">
        <div class="art thumb" style="${tone(c)}">${motif(c.motif,c.pal,c.id,60,60)}</div>
        <div style="flex:1;min-width:0">
          <span class="eyebrow tone" style="${tone(c)}">${h(c.topic)}</span>
          <h3 style="margin:6px 0 5px;font-size:16px">${h(c.title)}</h3>
          <p class="small" style="margin:0">${a.status==='completed'
            ?`${a.grade?a.grade.correct+' of '+a.grade.total+' right':''} · ${a.localDate}`
            :`Missed this one. Still worth a read, it just can't count.`}</p>
        </div>
      </button>`}).join('')
      : `<div class="note plain">Nothing here yet. Tonight's will be the first.</div>`;
  } else if(tab==='saved'){
    body = S.bookmarks.length? S.bookmarks.map(id=>{const c=content(id);return `
      <div class="today-card" style="margin-bottom:11px;display:flex;gap:14px;align-items:center;padding:14px">
        <div class="art thumb" style="${tone(c)}">${motif(c.motif,c.pal,c.id,60,60)}</div>
        <div style="flex:1;min-width:0">
          <h3 style="margin:0 0 7px;font-size:16px">${h(c.title)}</h3>
          <div class="row"><a class="small" href="${h(c.source.url)}" target="_blank" rel="noopener">Read the story</a>
            <button class="btn tiny ghost" data-unsave="${id}">Remove</button></div>
        </div>
      </div>`}).join('')
      : `<div class="note plain">Nothing saved. Hit Save while you're reading and it turns up here.</div>`;
  } else {
    body = S.highlights.length? `<div class="sticky-wrap">${S.highlights.slice().reverse().map((x,i)=>{
      const c=content(x.cid);
      const rot=((i%5)-2)*1.6;
      return `<div class="sticky-note" style="transform:rotate(${rot}deg)">
        <p style="margin:0 0 10px">${h(x.t)}</p>
        <div class="row" style="margin-top:6px"><span class="small" style="opacity:.6;font-size:12px">${h(c?c.title:'')}</span>
          <button class="btn tiny ghost" data-unhl="${h(x.k)}" style="font-size:11px">Remove</button></div>
      </div>`;}).join('')}</div>`
      : `<div class="note plain">No lines kept yet. Tap any sentence while you read and it stays here.</div>`;
  }
  return `<h1>Everything you've kept</h1>
    <div class="chips" style="margin:20px 0 22px">${t('history','Read',all.length)}${t('saved','Saved',S.bookmarks.length)}${t('highlights','Lines',S.highlights.length)}</div>
    ${body}`;
}

function streakChip(){

/* ============ REWARD FX ============ */
const REDUCED_MOTION=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fireConfetti(xPct,yPct,label){
  const host=$('#device'); if(!host) return;
  if(REDUCED_MOTION){
    if(label){ toast(label); }
    return;
  }
  const rect=host.getBoundingClientRect();
  const x=rect.width*xPct, y=rect.height*yPct;
  const colors=['#0C6B47','#128A5C','#9B4A32','#E0EFE7','#F3E9D4','#7A4E9E'];
  const n=24;
  for(let i=0;i<n;i++){
    const el=document.createElement('i'); el.className='confetti-piece';
    const ang=Math.random()*Math.PI*2, dist=60+Math.random()*95;
    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.setProperty('--dx',(Math.cos(ang)*dist)+'px');
    el.style.setProperty('--dy',(Math.sin(ang)*dist-46)+'px');
    el.style.setProperty('--rot',(Math.random()*520-260)+'deg');
    el.style.setProperty('--dur',(850+Math.random()*550)+'ms');
    el.style.background=colors[i%colors.length];
    el.style.borderRadius=Math.random()>.5?'50%':'2px';
    host.appendChild(el);
    setTimeout(()=>el.remove(),1600);
  }
  if(label){
    const pop=document.createElement('div'); pop.className='xppop';
    pop.style.left=x+'px'; pop.style.top=y+'px'; pop.textContent=label;
    host.appendChild(pop);
    setTimeout(()=>pop.remove(),1300);
  }
}
function fireConfettiFromEl(el,label){
  const host=$('#device');
  if(!el||!host) return fireConfetti(.5,.42,label);
  const br=el.getBoundingClientRect(), hr=host.getBoundingClientRect();
  fireConfetti((br.left+br.width/2-hr.left)/hr.width,(br.top+br.height/2-hr.top)/hr.height,label);
}
function animateCount(sel,to,dur){
  const el=$(sel); if(!el) return;
  if(REDUCED_MOTION){ el.textContent=to; return; }
  const start=performance.now();
  function step(t){
    const p=Math.min(1,(t-start)/dur), eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(eased*to);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

  if(a==='signout'){ signOut(); return; }
  if(a.startsWith('theme:')){

  }
  if(a==='savename'){

  }
  if(a==='streak:freeze'){
    const thisWeek=today().slice(0,8);
    if(S.user.streakFreezeUsed===thisWeek){ toast("Freeze already used this week."); return; }
    if((S.user.currentStreak||0)<3){ toast("Earn a 3-day streak to unlock freeze."); return; }
    S.user.streakFreezeUsed=thisWeek;
    toast("Streak frozen for tonight. See you tomorrow.");
    save(); render(); return;
  }
  if(a==='auth:magic'){
    const email = document.getElementById('auth-email')?.value?.trim();
    if(!email){ return; }
    const {error} = await signInMagicLink(email);
    if(error){ alert('Could not send link: '+error.message); return; }
    S._authFlow='email_sent'; render(); return;
  }
  if(a==='dayboundary'){ u.dayStartHour=u.dayStartHour===4?0:4; save();
    toast(u.dayStartHour===4?'Your day now ends at 4am.':'Your day ends at midnight again.'); return render(); }
  if(a==='start'||a==='review') return startLearning();
  if(a==='exit'){ S.tab='today'; save(); return render(); }
  if(a==='bookmark'){ const c=content(S.assignments.find(x=>x.id===L.aid).contentId);
    const i=S.bookmarks.indexOf(c.id); i>=0?S.bookmarks.splice(i,1):S.bookmarks.push(c.id);
    S.keepScroll=true; save(); return render(); }
  if(a==='share'){
    let c=null;
    if(SHEET&&L.sheetContentId) c=content(L.sheetContentId);
    else if((S.tab==='learn'||S.tab==='done')&&L.aid){
      const asn=S.assignments.find(x=>x.id===L.aid); c=asn&&content(asn.contentId);
    }
    return doShare(S.tab==='done'&&L.receipt?streakShare(L.receipt):c?storyShare(c):appShare());
  }
  if(a==='share:app') return doShare(appShare());
  if(a==='nextcard') return advance(1);
  if(a==='prevcard') return advance(-1);
  /* keyboard nav */
  if(a==='grade') return gradeOne();
  if(a==='finish') return finish();
  if(a==='reflect') return saveReflection();
  if(a&&a.startsWith('tab:')){ S.tab=a.slice(4); save(); return render(); }
  if(a==='export') return exportData();
  if(a==='delete') return confirmDelete();
  if(a==='delete-yes'){ await wipe(); S=blank(); SHEET=null; save(); return render(); }
  if(a==='sheet-close'){ SHEET=null; return render(); }
}

/* ============ deck navigation ============ */
// Swipe, because a story deck that only responds to taps feels half-built.
(function(){
  let x0=null,y0=null;
  /* TikTok scroll-snap — sync L.idx from scroll position */
  let _deckScrollTimer=null;
  document.addEventListener('scroll',e=>{
    if(S.tab!=='learn') return;
    const deck=document.getElementById('deck');
    if(!deck||e.target!==deck) return;
    clearTimeout(_deckScrollTimer);
    _deckScrollTimer=setTimeout(()=>{
      const slides=deck.querySelectorAll('.deck-slide');
      const scrollTop=deck.scrollTop;
      const h=deck.clientHeight;
      const idx=Math.round(scrollTop/h);
      if(idx!==L._slideIdx){ L._slideIdx=idx; syncSlideState(idx); }
    },80);
  },{passive:true,capture:true});
})();

function scrollToSlide(n, smooth){
  const deck=document.getElementById('deck');
  if(!deck) return;
  deck.scrollTo({top: n * deck.clientHeight, behavior: smooth?'smooth':'instant'});
}

function syncSlideState(slideIdx){
  const a=S.assignments.find(x=>x.id===L.aid);
  if(!a) return;
  const c=content(a.contentId);
  const cardCount=c.cards.length;
  const quizCount=c.quiz.length;
  if(slideIdx<cardCount){
    L.idx=slideIdx; L.qi=0;
  } else if(slideIdx<cardCount+quizCount){
    L.idx=cardCount; L.qi=slideIdx-cardCount;
    /* auto-grade if user swiped past ungraded quiz */
    if(L.qa[L.qi]!=null&&!(L.qgrade&&L.qgrade[L.qi])){
      gradeOne();
    }
  } else {
    L.idx=cardCount+quizCount;
  }
  L._slideIdx=slideIdx;
  save();
  /* re-render to update segs + quiz state without scrolling */
  const deck=document.getElementById('deck');
  const top=deck?deck.scrollTop:0;
  render();
  requestAnimationFrame(()=>{
    const d=document.getElementById('deck');
    if(d) d.scrollTop=top;
  });
}

function scrollAfterGrade(qi){
  /* After grading, keep on same slide — result shows inline */
  /* If correct, auto-advance after 1.2s */
  const a=S.assignments.find(x=>x.id===L.aid);
  const c=content(a.contentId);
  if(L.qgrade[qi] && L.qgrade[qi].ok){
    const nextSlide=c.cards.length+qi+1;
    setTimeout(()=>scrollToSlide(nextSlide,true),1200);
  }
  /* If wrong — stay, explanation shows inline, user swipes when ready */
}

function advance(dir){
  /* Legacy — kept for keyboard nav */
  const deck=document.getElementById('deck');
  if(!deck) return;
  const cur=Math.round(deck.scrollTop/deck.clientHeight);
  scrollToSlide(cur+dir, true);
}
function startLearning(){
  const r=CORE.getOrCreateAssignment(DB(),S.user,now());
  if(r.error){ toast(errText(r.error)); return; }
  const a=r.assignment;
  if(!a.startedAt) a.startedAt=now();
  L={aid:a.id,idx:0,pred:null,qa:[],qi:0,qgrade:{}};
  S.tab='learn'; save(); render();
}
function gradeOne(){
  const a=S.assignments.find(x=>x.id===L.aid), c=content(a.contentId);
  const q=L.qi||0;
  L.qgrade[q]=CORE.gradeQuiz(c,L.qa).detail[q];   // graded server-side
  S.keepScroll=true; save(); render();
  if(L.qgrade[q].ok){
    haptic('correct');
    const per=Math.round(CORE.XP.quiz/c.quiz.length);
    const isLast=q===c.quiz.length-1;
    const perfect=isLast&&c.quiz.every((_,i)=>L.qgrade[i]&&L.qgrade[i].ok);
    const label=perfect?`+${per+CORE.XP.perfectQuiz} · Perfect!`:`+${per}`;
    requestAnimationFrame(()=>{
      const el=document.querySelector('.sel[data-s="right"]');
      if(el){ el.classList.add('wash'); setTimeout(()=>el.classList.remove('wash'),700); }
      fireConfettiFromEl(el,label);
    });
  } else {
    haptic('wrong');
    requestAnimationFrame(()=>{
      const el=document.querySelector('.sel[data-s="wrong"]');
      if(el){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),300); }
    });
  }
  scrollAfterGrade(L.qi||0);
}

    localDate:a.localDate,quizAnswers:L.qa,bookmarked:S.bookmarks.includes(a.contentId)});

  L.receipt=res.receipt; L.celebrated=false; L._prevLevel=prevLv; S.tab='done'; save(); render();
  haptic('complete');
  requestAnimationFrame(()=>{

    <div class="row"><span class="small">Day ends</span><strong>${S.user.dayStartHour===4?'4am':'midnight'}</strong></div>
    <div class="row"><span class="small">Streak</span><strong class="tnum">${S.user.currentStreak||0} (max ${S.user.longestStreak||0})</strong></div>
    <div class="row"><span class="small">XP / level</span><strong class="tnum">${S.user.xp} · L${lv.level} ${lv.name}</strong></div>
    <div class="row"><span class="small">Seen</span><strong class="tnum">${new Set(S.assignments.map(a=>a.contentId)).size}/${CORPUS.length}</strong></div>
    <div class="row"><span class="small">XP rows</span><strong class="tnum">${S.xp.length}</strong></div>`;
  const b=$('#cbtns');
  if(b&&!b.childElementCount) b.innerHTML=CBTNS.map(([k,l,hot])=>`<button class="cbtn ${hot?'hot':''}" data-c="${k}">${l}</button>`).join('');
}

function localEpoch(dateStr,hh,mm){
  return CORE.parseDate(dateStr)-12*3600000-S.user.tzOffsetMin*60000+(S.user.dayStartHour||0)*3600000+hh*3600000+mm*60000;
}
function autoPlay(){
  const r=CORE.getOrCreateAssignment(DB(),S.user,now());
  if(r.error) return {error:r.error};
  if(r.assignment.status==='completed') return {already:true};
  r.assignment.startedAt=now();
  const c=content(r.assignment.contentId);
  return CORE.completeLearning(DB(),S.user,now(),{localDate:r.assignment.localDate,
    quizAnswers:c.quiz.map(q=>q.correct)});
}

async function consoleAction(k){
  const u=S.user;
  if(k==='reset'){ await wipe(); S=blank(); $('#log').innerHTML=''; log('State cleared.','dim'); save(); return render(); }

  if(k==='skip1'||k==='skip2'){
    const n=k==='skip1'?1:2, before=u.currentStreak||0, d0=today();
    S.clockOffset+=n*86400000;
    log(`Clock ${d0} -> ${today()} (+${n}d)`,'dim');
    if(n===2) log(`  streak still ${before} until the next completion decides it`,'dim');
    save(); return render();
  }
  if(k==='midnight'){
    const target=localEpoch(today(),23,55);
    S.clockOffset=target-Date.now();
    log('Clock set to 23:55 local. 5 minutes of day left.','dim'); save(); return render();
  }
  if(k==='auto7'){
    for(let i=0;i<7;i++){ const r=autoPlay(); if(r.error){log('  '+r.error,'no');break;} S.clockOffset+=86400000; }
    log(`Played 7 days. Streak ${u.currentStreak}, XP ${u.xp}.`,'ok'); save(); return render();
  }
  if(k==='exhaust'){
    let n=0,rev=0;
    for(let i=0;i<CORPUS.length+3;i++){
      const r=CORE.getOrCreateAssignment(DB(),S.user,now());
      if(r.error){ log('BROKE the daily promise: '+r.error,'no'); break; }
      if(r.assignment.revisit) rev++;
      const p=autoPlay(); if(!p.error) n++;
      S.clockOffset+=86400000;
    }
    log(`Ran ${n} days past a ${CORPUS.length}-item library.`,'ok');
    log(rev?`  ${rev} served as flagged revisits, none silently repeated`:'  no exhaustion reached','ok');
    save(); return render();
  }
  if(k==='tomorrow'){
    const t=CORE.addDays(today(),1);
    const r=CORE.getOrCreateAssignment(DB(),S.user,now(),t);
    if(r.error==='FUTURE_CONTENT_LOCKED') log(`GET /daily?date=${t} -> ${r.status} ${r.error}`,'ok');
    else log('LEAK: tomorrow was served -> '+JSON.stringify(r).slice(0,90),'no');
    const far=CORE.getOrCreateAssignment(DB(),S.user,now(),'2031-01-01');
    log(`GET /daily?date=2031-01-01 -> ${far.status} ${far.error}`, far.status===403?'ok':'no');
    return;
  }
  if(k==='replay'){
    const a=S.assignments.find(x=>x.localDate===today());
    if(!a||a.status!=='completed'){ log('Finish today first, then replay it.','dim'); return; }
    const xp0=u.xp, s0=u.currentStreak, rows0=S.xp.length;
    for(let i=0;i<5;i++) CORE.completeLearning(DB(),S.user,now(),{localDate:a.localDate,quizAnswers:[0,0,0]});
    const ok=xp0===u.xp&&s0===u.currentStreak&&rows0===S.xp.length;
    log(`5 replayed completions -> XP ${xp0}->${u.xp}, streak ${s0}->${u.currentStreak}, rows ${rows0}->${S.xp.length}`, ok?'ok':'no');
    log(ok?'  idempotent, nothing double-paid':'  ABUSE POSSIBLE','ok');
    save(); return render();
  }
  if(k==='west'||k==='east'){
    const to=k==='west'?['Los Angeles',-420]:['Kathmandu',345];
    const d0=today(), from=zoneName();
    u.prevTzOffsetMin=u.tzOffsetMin; u.tzOffsetMin=to[1]; u.zone=to[0];
    const shift=(u.tzOffsetMin-u.prevTzOffsetMin)/60;
    log(`Flew ${from} -> ${to[0]} (${shift>=0?'+':''}${shift}h): local day ${d0} -> ${today()}`,'dim');
    const r=CORE.getOrCreateAssignment(DB(),S.user,now());
    if(k==='west'){
      const ok=r.assignment.localDate>=d0;
      log(`  server day held at ${r.assignment.localDate}`, ok?'ok':'no');
      log(ok?'  no second day bought by flying west':'  DUPLICATE DAY','ok');
    } else {
      // Say plainly whether the bridge is armed. It only forgives a skipped
      // date when the move is 8h or more forward, and Lagos -> Kathmandu is
      // 4.75h, so from here it is honestly NOT armed. Claiming otherwise was
      // the old copy's bug.
      const armed=shift>=8;
      log(`  new day ${r.assignment.localDate}`,'ok');
      log(armed?`  +${shift}h forward: a single skipped date would be bridged, not punished`
               :`  +${shift}h forward: under the 8h threshold, so a skipped date still resets`,
        armed?'ok':'dim');
    }
    save(); return render();
  }
  if(k==='offline'){
    const r=CORE.getOrCreateAssignment(DB(),S.user,now());
    if(r.error){ log(r.error,'no'); return; }
    const d=r.assignment.localDate;
    r.assignment.startedAt=localEpoch(d,23,40);
    const claimed=localEpoch(d,23,52);
    S.clockOffset=localEpoch(CORE.addDays(d,1),7,30)-Date.now();
    const c=content(r.assignment.contentId);
    const res=CORE.completeLearning(DB(),S.user,now(),{localDate:d,quizAnswers:c.quiz.map(q=>q.correct),
      offlineSync:true,clientCompletedAt:claimed});
    if(res.error) log(`Offline sync refused: ${res.error}`,'no');
    else log(`Finished 23:52 offline on ${d}, synced 07:30 next day -> counted, streak ${res.streak.current}`,'ok');
    const bad=CORE.getOrCreateAssignment(DB(),S.user,now());
    if(!bad.error&&!bad.assignment.startedAt) bad.assignment.startedAt=now();
    const cheat=CORE.completeLearning(DB(),S.user,now(),{localDate:CORE.addDays(d,-4),quizAnswers:[0,0]});
    log(`  backdating 4 days -> ${cheat.error||'ACCEPTED'}`, cheat.error?'ok':'no');
    save(); return render();
  }
  if(k==='recompute'){
    const cached=u.currentStreak;
    u.currentStreak=999;
    const re=CORE.recomputeStreak(DB(),u,today());
    u.currentStreak=re.current; u.longestStreak=re.longest;
    log(`Corrupted streak to 999, recomputed from completion log -> ${re.current} (was ${cached})`,
      re.current===cached?'ok':'no');
    log('  completions are the source of truth, the counter is a cache','dim');
    save(); return render();
  }
  if(k==='payload'){
    const r=CORE.getOrCreateAssignment(DB(),S.user,now());
    const p=CORE.toClientPayload(content(r.assignment.contentId));
    const s=JSON.stringify(p);
    const leak=/"correct"|"explain"/.test(s);
    log(`Client payload ${s.length} bytes, ${p.quiz.length} questions`,'dim');
    log(leak?'  ANSWERS LEAKED to the client':'  no answer or explanation field present', leak?'no':'ok');
    log(`  quiz[0] keys: ${Object.keys(p.quiz[0]).join(', ')}`,'dim');
    return;
  }
}

/* ============ boot ============ */
function applyTheme(theme){
  const d=document.documentElement;
  d.removeAttribute('data-theme');
  if(theme&&theme!=='auto') d.setAttribute('data-theme',theme);
  /* Also mirror on #device for scoped overrides */
  const dev=document.getElementById('device');
  if(dev){ dev.removeAttribute('data-theme'); if(theme&&theme!=='auto') dev.setAttribute('data-theme',theme); }
}

(async function(){
  const saved=await load();
  if(saved&&saved.v===1) S=Object.assign(blank(),saved,{user:Object.assign(blank().user,saved.user)});
  applyTheme(S.user.theme||'auto');
  await initAuth();
  render();
  log('One Thing prototype ready.','dim');
  log('Server core: '+Object.keys(CORE).length+' exported functions.','dim');
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
